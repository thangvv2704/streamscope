[package]
name = "streamscope"
version = "0.1.0"
description = "StreamScope — the streaming client developers actually enjoy using"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "streamscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Kafka client — link against the system librdkafka installed via Homebrew
# (no cmake / source build needed).
rdkafka = { version = "0.36", features = ["dynamic-linking"] }

# Error handling
thiserror = "1"

# UUID for connection ids
uuid = { version = "1", features = ["v4", "serde"] }

# Schema Registry: HTTP client to fetch schemas, and Avro decoding.
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
apache-avro = "0.17"
