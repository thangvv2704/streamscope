name: Release

# Build native bundles for macOS, Windows and Linux and attach them to a
# GitHub Release. Triggered by pushing a version tag (e.g. v0.1.0), or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # Intel macOS
          - platform: macos-13
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # Linux x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          # Windows x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      # Linux needs Tauri's system dependencies (WebKitGTK etc.).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            cmake \
            libcurl4-openssl-dev \
            libsasl2-dev \
            zlib1g-dev \
            libzstd-dev

      # cmake is preinstalled on macOS/Windows GitHub runners; ensure it exists.
      - name: Verify cmake (macOS/Windows)
        if: matrix.platform != 'ubuntu-22.04'
        run: cmake --version

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "StreamScope ${{ github.ref_name }}"
          releaseBody: |
            Native StreamScope build for ${{ matrix.target }}.

            **Install (macOS):** unzip / open the .dmg, drag the app to
            Applications, then right-click → Open on first launch.
            **Windows:** run the .msi / .exe installer.
            **Linux:** run the .AppImage, or install the .deb.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
